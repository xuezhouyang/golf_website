name: Build PostaFide Android APK

on:
  push:
    branches:
      - main
      - 'claude/sms2email**'
    paths:
      - 'sms2email/**'
  pull_request:
    paths:
      - 'sms2email/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: sms2email

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: sms2email

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        working-directory: sms2email

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep '^\s*versionName = ' sms2email/app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep '^\s*versionCode = ' sms2email/app/build.gradle.kts | awk '{print $3}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: List APK files (for debugging)
        run: |
          echo "Release APKs:"
          ls -lh sms2email/app/build/outputs/apk/release/
          echo ""
          echo "Debug APKs:"
          ls -lh sms2email/app/build/outputs/apk/debug/

      - name: Generate checksums
        run: |
          cd sms2email/app/build/outputs/apk/release
          sha256sum PostaFide-v${{ steps.version.outputs.version_name }}-release.apk > PostaFide-v${{ steps.version.outputs.version_name }}-release.apk.sha256
          cd ../debug
          sha256sum PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk > PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk.sha256

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PostaFide-v${{ steps.version.outputs.version_name }}-release
          path: |
            sms2email/app/build/outputs/apk/release/PostaFide-v${{ steps.version.outputs.version_name }}-release.apk
            sms2email/app/build/outputs/apk/release/PostaFide-v${{ steps.version.outputs.version_name }}-release.apk.sha256
          retention-days: 90

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PostaFide-v${{ steps.version.outputs.version_name }}-debug
          path: |
            sms2email/app/build/outputs/apk/debug/PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk
            sms2email/app/build/outputs/apk/debug/PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sms2email/app/build/outputs/apk/release/PostaFide-v${{ steps.version.outputs.version_name }}-release.apk
            sms2email/app/build/outputs/apk/release/PostaFide-v${{ steps.version.outputs.version_name }}-release.apk.sha256
          body_path: sms2email/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## PostaFide Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name**: ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: PostaFide-v${{ steps.version.outputs.version_name }}-release.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          RELEASE_SIZE=$(du -h sms2email/app/build/outputs/apk/release/PostaFide-v${{ steps.version.outputs.version_name }}-release.apk | cut -f1)
          DEBUG_SIZE=$(du -h sms2email/app/build/outputs/apk/debug/PostaFide-v${{ steps.version.outputs.version_name }}-debug.apk | cut -f1)
          echo "- Release: $RELEASE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Debug: $DEBUG_SIZE" >> $GITHUB_STEP_SUMMARY
